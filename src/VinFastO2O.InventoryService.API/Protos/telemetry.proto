syntax = "proto3";

package telemetry;

option csharp_namespace = "VinFastO2O.InventoryService.API.Protos";

service TelemetryIngestion {
  rpc SubmitTelemetry (TelemetryRequest) returns (TelemetryResponse);
}

message TelemetryRequest {
  string vin = 1;
  double latitude = 2;
  double longitude = 3;
  double speed = 4;
  double battery_percentage = 5;
  double battery_temperature = 6;
  int64 timestamp_unix = 7;
}

message TelemetryResponse {
  bool success = 1;
  string message = 2;
}
