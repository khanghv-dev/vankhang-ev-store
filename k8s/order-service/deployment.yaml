apiVersion: apps/v1
kind: Deployment
metadata:
  name: order-service
  namespace: vinfast-o2o
  labels:
    app: order-service
    tier: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: order-service
  template:
    metadata:
      labels:
        app: order-service
    spec:
      containers:
        - name: order-service
          image: vinfast/order-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: order-db-secret
                  key: connection-string
            - name: ConnectionStrings__InventoryConnection
              valueFrom:
                secretKeyRef:
                  name: inventory-db-secret
                  key: connection-string
            - name: ConnectionStrings__RedisConnection
              value: redis-service.vinfast-o2o.svc.cluster.local:6379
            - name: Kafka__Host
              value: kafka-service.vinfast-o2o.svc.cluster.local:9092
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
