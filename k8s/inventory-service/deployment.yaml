apiVersion: apps/v1
kind: Deployment
metadata:
  name: inventory-service
  namespace: vinfast-o2o
  labels:
    app: inventory-service
    tier: api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 25%
      maxUnavailable: 0
  selector:
    matchLabels:
      app: inventory-service
  template:
    metadata:
      labels:
        app: inventory-service
    spec:
      containers:
        - name: inventory-service
          image: vinfast/inventory-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: Production
            - name: ConnectionStrings__DefaultConnection
              valueFrom:
                secretKeyRef:
                  name: inventory-db-secret
                  key: connection-string
            - name: ConnectionStrings__MongoConnection
              value: mongodb://mongodb-service.vinfast-o2o.svc.cluster.local:27017
            - name: ConnectionStrings__RedisConnection
              value: redis-service.vinfast-o2o.svc.cluster.local:6379
            - name: Kafka__Host
              value: kafka-service.vinfast-o2o.svc.cluster.local:9092
            - name: S3Settings__ServiceUrl
              value: http://minio-service.vinfast-o2o.svc.cluster.local:9000
            - name: S3Settings__AccessKey
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: access-key
            - name: S3Settings__SecretKey
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: secret-key
            - name: S3Settings__BucketName
              value: vinfast-product-images
            - name: S3Settings__PublicUrlPrefix
              value: http://minio.vinfast-o2o.com/vinfast-product-images
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 25
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
